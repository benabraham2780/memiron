<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ממירון</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="ממירון">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1240e0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, exact, a personal everyday tool
   IDEA: an engineering conversion datasheet you keep in your pocket
   PICTURE: the live converter itself, big numbers, at the top
   COLOUR and TYPE: cobalt strip, white / pale blue panels, coral swap accent; Rubik
   LAYOUT: strip, category tabs, converter card, then quick table + extra tool */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0a0d18);--ink:light-dark(#0b1020,#eef1ff);--mute:light-dark(#566079,#9aa5c4);
--pale:light-dark(#eef2ff,#141a2e);--line:light-dark(#d5ddf5,#262f4d);--blue:#1240e0;--blue2:light-dark(#1240e0,#7d9bff);--acc:#ff6f59;--field:light-dark(#ffffff,#0f1426)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Rubik,system-ui,sans-serif;overflow-x:clip}
.strip{background:var(--blue);color:#fff;padding:16px max(5vw,16px)}
.strip h1{margin:0;font-size:clamp(30px,6vw,44px);line-height:1.05;font-weight:700}
.strip p{margin:6px 0 0;opacity:.85}
.tag{margin:2px 0 0;font-size:15px;opacity:.85}
.brand{display:flex;align-items:center;gap:10px}.logo{width:clamp(44px,9vw,58px);height:auto;flex:none}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px max(5vw,16px);background:var(--pale);border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{flex:none;min-height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--line);background:var(--field);color:var(--ink);font:500 16px Rubik,sans-serif;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
main{max-width:860px;margin:0 auto;padding:24px max(5vw,16px) 48px}
.tool{background:var(--pale);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,28px);display:grid;gap:10px}
.side{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,15em);gap:10px;align-items:stretch}
.side input{width:100%;font:700 clamp(30px,7vw,48px)/1.1 Rubik,sans-serif;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--ink);text-align:right}
.side.to input{color:var(--blue2)}
select{width:100%;min-height:44px;font:500 16px Rubik,sans-serif;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--ink)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.mid{display:flex;align-items:center;gap:12px}
.mid hr{flex:1;border:0;border-top:1px dashed var(--line);margin:0}
#swap{width:48px;height:48px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:22px;cursor:pointer;transition:transform .25s}
#swap:hover{transform:rotate(180deg)}
.rule{margin:6px 0 0;color:var(--mute);font-size:15px}
h2{font-size:20px;margin:32px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:8px}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--field)}
.row:hover{border-color:var(--blue2)}
.row b{color:var(--blue2);white-space:nowrap}.row span{white-space:nowrap;color:var(--mute)}
.card{border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.inl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.inl input{width:6.5em;font:500 18px Rubik,sans-serif;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink);text-align:right}
.out{font-size:22px;font-weight:700;color:var(--blue2)}
.rates{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:8px}
.rates label{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--field)}
.rates input{width:6.5em;font:500 16px Rubik,sans-serif;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-align:right}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink);font:500 15px Rubik,sans-serif;cursor:pointer;justify-self:start}
.tool[hidden],[hidden]{display:none!important}
.note{color:var(--mute);font-size:14px;margin:0}
.chip{min-height:44px;min-width:52px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--field);color:var(--ink);font:500 16px Rubik,sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
#kx{width:6em}.bigin{flex:1;font:700 clamp(28px,6vw,40px)/1.1 Rubik,sans-serif!important;width:auto!important}
.inl select{width:auto;flex:1}
.row.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.row b.big{font-size:24px}.row small{color:var(--mute)}
.scroll{overflow-x:auto}
.tbl{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.tbl th{font-size:13px;color:var(--mute);font-weight:500;white-space:normal}
.tbl tr[data-i]{cursor:pointer}.tbl tr.on td{background:var(--pale);color:var(--blue2);font-weight:700}
.chip.rec{border-color:var(--blue2);border-width:2px}
.cn{display:grid;gap:4px;padding:12px 14px;border-radius:12px;background:var(--field);border:1px solid var(--line)}.cn b{font-size:20px;color:var(--blue2)}.cn span{color:var(--mute);font-size:15px}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--mute);cursor:pointer;flex:none}
.search{width:100%;font:500 17px Rubik,sans-serif;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink)}
.row .chip{min-height:36px;flex:none}
.qrow{display:grid;gap:2px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--field);overflow-wrap:anywhere}
.qrow:hover{border-color:var(--blue2)}.qrow span{color:var(--mute);font-size:14px}.qrow b{color:var(--blue2);font-size:18px}
.fchip{display:inline-flex;align-items:center;gap:8px;padding:4px 6px 4px 12px;border:1px solid var(--line);border-radius:22px;background:var(--field)}
.fchip .x{width:30px;height:30px}
.pick{display:none;width:100%;min-height:52px;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--ink);font:500 16px Rubik,sans-serif;cursor:pointer;text-align:start}
.pick::after{content:'⌕';color:var(--blue2);font-size:20px}
.tool.m select{display:none}.tool.m .pick{display:flex}
#sheet{position:fixed;inset:0;background:rgb(0 0 0/.45);display:flex;align-items:flex-start;justify-content:center;padding:max(5vh,12px) 12px;z-index:9}
#sheet[hidden]{display:none!important}
.sbox{background:var(--bg);width:min(560px,100%);max-height:88vh;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 60px rgb(0 0 0/.3)}
.sbox .inl{flex-wrap:nowrap}.sbox .search{flex:1}
#slist{overflow-y:auto;display:grid;gap:4px;overscroll-behavior:contain}
.srow{display:block;width:100%;text-align:start;min-height:46px;padding:10px 12px;border-radius:10px;border:1px solid transparent;background:var(--pale);color:var(--ink);font:500 16px Rubik,sans-serif;cursor:pointer}
.srow:hover,.srow.on{border-color:var(--blue2)}.srow small{color:var(--acc)}
.slab{margin:8px 4px 2px;font-size:13px;color:var(--mute)}
@media(max-width:600px){.side{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){#swap{transition:none}}
</style>
</head>

    <p class="note">כולל שעון קיץ וחורף אוטומטית לפי התאריך שבחרת. אפשר לחפש בעברית או באנגלית.</p>`;
    const shown=()=>[{n:'ישראל',z:'Asia/Jerusalem',pin:1}].concat(FAV);
    const fillF=()=>{const cur=S.tz||'Asia/Jerusalem';$('tf').innerHTML=shown().map(c=>`<option value="${c.z}">${esc(c.n)}</option>`).join('');$('tf').value=shown().some(c=>c.z===cur)?cur:'Asia/Jerusalem'};
    const when=()=>{const src=$('tf').value;const [h,m]=($('tt').value||'00:00').split(':').map(Number),[Y,M,D]=($('td').value||'2026-01-01').split('-').map(Number);let u=Date.UTC(Y,M-1,D,h,m);u-=off(src,new Date(u))*60000;return new Date(Date.UTC(Y,M-1,D,h,m)-off(src,new Date(u))*60000)};
    const show=()=>{S.tz=$('tf').value;save();const d=when(),src=S.tz;
      $('tres').innerHTML=shown().map((c,i)=>{const t=new Intl.DateTimeFormat('he-IL',{timeZone:c.z,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(d),day=new Intl.DateTimeFormat('he-IL',{timeZone:c.z,weekday:'short',day:'numeric',month:'numeric'}).format(d),df=(off(c.z,d)-off(src,d))/60;
        return `<div class="row${c.z===src?' on':''}"><span>${esc(c.n)}<br><small>${day} · ${df===0?'אותה שעה':(Math.abs(df)===1?'שעה אחת':fmt(Math.abs(df))+' שעות')+(df>0?' קדימה':' אחורה')}</small></span><span class="inl" style="gap:6px;flex-wrap:nowrap"><b class="big">${t}</b>${c.pin?'':`<button class="x" data-del="${i-1}" aria-label="הסר מהמועדפים">✕</button>`}</span></div>`}).join('')+(FAV.length?'':'<p class="note">עדיין אין מועדפים. חפש עיר למטה והוסף אותה.</p>')};
    const ZH=ZCITY.map(([n,z])=>({n,z}));
    let IANA=[];try{IANA=Intl.supportedValuesOf('timeZone').map(z=>({n:z.split('/').pop().replace(/_/g,' ')+' ('+z.split('/')[0]+')',z}))}catch(e){}
    const search=()=>{const q=$('tq').value.trim().toLowerCase();if(!q){$('tsr').innerHTML='';return}
      const res=ZH.filter(c=>c.n.includes(q)).concat(IANA.filter(c=>c.n.toLowerCase().includes(q))).slice(0,12);
      $('tsr').innerHTML=res.length?res.map(c=>{const has=FAV.some(f=>f.n===c.n);return `<div class="row"><span>${esc(c.n)}</span>${has?'<b>✓ במועדפים</b>':`<button class="chip" data-add="${esc(c.n)}" data-z="${c.z}">+ הוסף</button>`}</div>`}).join(''):'<p class="note">לא נמצאה עיר כזו. נסה שם אחר או באנגלית.</p>'};
    $('tsr').addEventListener('click',e=>{const b=e.target.closest('[data-add]');if(!b)return;FAV.push({n:b.dataset.add,z:b.dataset.z});S.fav=FAV;save();fillF();show();search()});
    $('tres').addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(!b)return;FAV.splice(+b.dataset.del,1);S.fav=FAV;save();fillF();show();search()});
    ['tt','td','tf'].forEach(i=>$(i).addEventListener('input',show));$('tq').addEventListener('input',search);
    $('tnow').addEventListener('click',()=>{const p=new Intl.DateTimeFormat('en-CA',{timeZone:$('tf').value,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()),q=t=>p.find(z=>z.type===t).value;$('tt').value=`${q('hour')}:${q('minute')}`;$('td').value=`${q('year')}-${q('month')}-${q('day')}`;show()});
    fillF();show();
  }else if(cat==='tip'){
    const T=Object.assign({bill:200,p:12,n:1,r:false,cn:'ישראל'},S.tip||{});
    const names=Object.keys(TIPS).sort((a,b)=>a.localeCompare(b,'he'));
    x.innerHTML=`<div class="tool">
      <div class="inl"><input id="kf" placeholder="חיפוש מדינה" aria-label="חיפוש מדינה" style="width:9em"><select id="ky" aria-label="מדינה"></select></div>
      <div class="cn" id="kinfo"></div>
      <div class="inl"><input id="kb" inputmode="decimal" dir="ltr" value="${T.bill}" aria-label="סכום החשבון" class="bigin"></div>
      <div class="inl" id="kp"></div>
      <div class="inl"><span>מספר אנשים</span><button class="chip" id="km">−</button><b id="kn"></b><button class="chip" id="kpl">+</button><label class="inl" style="margin-inline-start:auto"><input type="checkbox" id="kr" style="width:22px;height:22px"> עגל למעלה לכל אחד</label></div>
      <div class="grid" id="kres"></div></div>
      <p class="note">הטווחים הם הנחיה כללית למסעדות עם שירות. לפני שמוסיפים טיפ, כדאי לבדוק בחשבון אם כבר יש שורת "service charge" או "שירות".</p>`;
    const setP=()=>{const [mn,mx]=TIPS[T.cn];T.p=Math.round((mn+mx)/2);if($('kx'))$('kx').value=''};
    const fillC=()=>{const q=$('kf').value.trim();const list=names.filter(n=>!q||n.includes(q));$('ky').innerHTML=list.map(n=>`<option value="${n}">${cf(n)}${n}</option>`).join('');if(list.includes(T.cn))$('ky').value=T.cn;else if(list.length){T.cn=list[0];setP()}};
    const show=()=>{T.bill=parse($('kb').value)||0;T.r=$('kr').checked;const cx=parse($('kx').value);if(!isNaN(cx)&&cx>=0)T.p=cx;S.tip=T;save();
      const [mn,mx,nk]=TIPS[T.cn];$('kinfo').innerHTML=`<b>${cf(T.cn)}${T.cn}: ${mx===0?'לא נהוג לתת טיפ':mn===mx?mn+'%':mn+'%–'+mx+'%'}</b><span>${TN[nk]}</span>`;
      for(const b of $('kp').querySelectorAll('[data-p]'))b.setAttribute('aria-pressed',+b.dataset.p===T.p);$('kn').textContent=T.n;
      const tip=T.bill*T.p/100,tot=T.bill+tip;let per=tot/T.n;if(T.r)per=Math.ceil(per);const m=v=>new Intl.NumberFormat('en-US',{maximumFractionDigits:2,minimumFractionDigits:2}).format(v);
      $('kres').innerHTML=`<div class="row"><span>טיפ (${fmt(T.p)}%)</span><b>${m(tip)}</b></div><div class="row"><span>סה״כ לתשלום</span><b>${m(T.r?per*T.n:tot)}</b></div>${T.n>1?`<div class="row"><span>לכל אחד</span><b class="big">${m(per)}</b></div>`:''}`};
    const chips=()=>{const [mn,mx]=TIPS[T.cn];const set=[...new Set([0,mn,Math.round((mn+mx)/2),mx,5,10,15,20])].sort((a,b)=>a-b);
      $('kp').innerHTML=set.map(p=>`<button class="chip${p>=mn&&p<=mx?' rec':''}" data-p="${p}">${p}%</button>`).join('')+`<input id="kx" inputmode="decimal" dir="ltr" aria-label="אחוז אחר" placeholder="אחר %">`;
      $('kx').addEventListener('input',show)};
    $('kr').checked=T.r;fillC();chips();
    $('kf').addEventListener('input',()=>{fillC();chips();show()});
    $('ky').addEventListener('change',()=>{T.cn=$('ky').value;setP();chips();show()});
    $('kp').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b){T.p=+b.dataset.p;$('kx').value='';show()}});
    $('km').addEventListener('click',()=>{T.n=Math.max(1,T.n-1);show()});$('kpl').addEventListener('click',()=>{T.n++;show()});
    ['kb','kr'].forEach(i=>$(i).addEventListener('input',show));
    show();
  }
}
function extra(){
  const x=$('extra');
  if(cat==='money'){
    x.innerHTML=`<h2>המטבעות המועדפים שלי</h2><div class="card"><p class="note">המועדפים מופיעים ראשונים ברשימת הבחירה למעלה. שקל תמיד שם.</p><div class="inl" id="mfav"></div><input id="mq" class="search" placeholder="חפש מטבע להוספה, למשל דונג, פסו או THB" aria-label="חיפוש מטבע"><div class="grid" id="mres"></div></div>
    <h2>שערי המועדפים</h2><div class="card"><p class="note" id="rnote">${rnote()}</p><div class="rates" id="mrates"></div><button class="btn" id="reset">החזר לשערים המקוריים</button></div>`;
    const draw=()=>{const f=MF();
      $('mfav').innerHTML=f.length?f.map(k=>`<span class="fchip">${MN[k]}<button class="x" data-rm="${k}" aria-label="הסר">✕</button></span>`).join(''):'<p class="note">אין עדיין מועדפים.</p>';
      $('mrates').innerHTML=f.map(k=>`<label>1 ${fl(MC[k][2])} ${k} ${esc(MC[k][1])} =<span><input data-r="${k}" inputmode="decimal" dir="ltr" value="${+R[k].toPrecision(4)}"> ₪</span></label>`).join('')};
    const search=()=>{const q=$('mq').value.trim().toLowerCase();if(!q){$('mres').innerHTML='';return}const f=MF();
      const res=(ALLM.some(k=>k!=='ILS'&&mx(k,q))?ALLM.filter(k=>k!=='ILS'&&mx(k,q)):ALLM.filter(k=>k!=='ILS'&&mt(k,q))).slice(0,15);
      $('mres').innerHTML=res.length?res.map(k=>`<div class="row"><span>${MN[k]}</span>${f.includes(k)?'<b>✓</b>':`<button class="chip" data-add="${k}">+ הוסף</button>`}</div>`).join(''):'<p class="note">לא נמצא מטבע כזה.</p>'};
    const setF=f=>{S.mfav=f;save();fillSel();rule();draw();search()};
    $('mres').addEventListener('click',e=>{const b=e.target.closest('[data-add]');if(b)setF([...MF(),b.dataset.add])});
    $('mfav').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(b)setF(MF().filter(k=>k!==b.dataset.rm))});
    $('mq').addEventListener('input',search);
    $('mrates').addEventListener('input',e=>{const i=e.target.closest('[data-r]');if(!i)return;const v=parse(i.value);if(v>0){R[i.dataset.r]=v;S.rates=S.rates||{};S.rates[i.dataset.r]=v;save();calc(last);rule()}});
    $('reset').addEventListener('click',()=>{Object.assign(R,DR);delete S.rates;save();load()});
    draw();
  }else if(cat==='len'){
    x.innerHTML=`<h2>גובה של אדם</h2><div class="card">
      <div class="inl"><input id="hf" inputmode="decimal" dir="ltr" value="5" aria-label="פיט"> פיט <input id="hi" inputmode="decimal" dir="ltr" value="11" aria-label="אינץ׳"> אינץ׳ <span>=</span> <span class="out" id="ho"></span></div>
      <div class="inl"><input id="hc" inputmode="decimal" dir="ltr" value="180" aria-label="סנטימטר"> ס״מ <span>=</span> <span class="out" id="hr"></span></div>
      <p class="note">בארה״ב גובה נכתב כך: 5'11" = 5 פיט ו־11 אינץ׳.</p></div>`;
    const h1=()=>{const f=parse($('hf').value)||0,i=parse($('hi').value)||0,cm=(f*12+i)*2.54;$('ho').textContent=`${fmt(Math.round(cm*10)/10)} ס״מ (${fmt(Math.round(cm)/100)} מ׳)`};
    const h2=()=>{const c=parse($('hc').value);if(isNaN(c)){$('hr').textContent='';return}let t=c/2.54,f=Math.floor(t/12),i=Math.round((t-f*12)*10)/10;if(i>=12){f++;i=0}$('hr').textContent=`${f} פיט ו־${fmt(i)} אינץ׳ (${f}'${fmt(i)}")`};
    ['hf','hi'].forEach(id=>$(id).addEventListener('input',h1));$('hc').addEventListener('input',h2);h1();h2();
  }else if(cat==='temp'){
    x.innerHTML=`<h2>לזכור בקלות</h2><div class="card"><p class="note">32°F = 0°C (קפיאה) · 68°F = 20°C (נעים) · 98.6°F = 37°C (חום גוף) · 212°F = 100°C (רתיחה). הערכה מהירה מפרנהייט: מורידים 30 ומחלקים ב־2.</p></div>`;
  }else x.innerHTML='';
}
load();
live();
}
